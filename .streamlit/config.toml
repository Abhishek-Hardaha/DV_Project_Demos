[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#000000"
secondaryBackgroundColor = "#050505"
textColor = "#ffffff"
font = "sans serif"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
